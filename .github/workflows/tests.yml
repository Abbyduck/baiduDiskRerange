name: Offline checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: baidu-mcp/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm --prefix baidu-mcp ci
      - run: python -m unittest discover -s baidu-mcp -p 'test_*.py'
      - run: node --check baidu-mcp/bridge.mjs
      - run: node --check baidu-mcp/folder-dedup-app.js
      - run: node --check baidu-mcp/package-actions.js
